[package]
name = "pi-coworker-gui"
version = "0.1.0"
description = "企业 AI 助手（桌面客户端）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "pi_coworker_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
