<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>企业 AI 助手</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="sand-shell">
  <!-- 全局 SVG 图标符号 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12L20 4l-6 16-3-7-7-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </svg>
  <!-- 左侧栏 -->
  <aside class="sand-agents-sidebar">
    <div class="sand-agents-sidebar__brand">
      <img class="brand-appicon" src="./assets/app-icon.png" alt="企业 AI 助手" />
      <span class="sand-agents-sidebar__brand-text">
        <strong>企业 AI 助手</strong>
        <small>coworker · 本机个人版</small>
      </span>
    </div>

    <nav class="sand-nav">
      <button class="sand-nav__item active" data-view="chat">对话</button>
      <button class="sand-nav__item" data-view="today">今日</button>
      <button class="sand-nav__item" data-view="wizard">安装向导</button>
      <button class="sand-nav__item" data-view="perm">权限</button>
      <button class="sand-nav__item" data-view="status">状态</button>
    </nav>

    <div class="sand-agents-sidebar__account">
      <button id="account-trigger" type="button" aria-label="Account">
        <span class="sand-avatar sand-avatar--account" id="account-avatar">?</span>
        <span>
          <strong id="identity">未登录</strong>
          <small id="identity-sub">飞书授权后可用</small>
        </span>
      </button>
      <div id="account-menu" class="account-menu hidden">
        <button data-act="status">环境与状态</button>
        <button data-act="logout" class="danger">登出</button>
      </div>
    </div>
  </aside>

  <main class="sand-main">
    <!-- 对话 -->
    <section id="view-chat" class="view active">
      <header class="view-head">
        <span>企业问答</span>
      </header>
      <div class="chat-body">
        <div class="chat-main">
          <div id="messages" class="messages">
            <div id="messages-empty" class="empty">
              <div class="empty__mark sand-avatar sand-avatar--brand">迈</div>
              <div class="empty__title">问我公司制度、申请权限、查百科</div>
              <div class="empty__sub">对话由本机 AI 助手回答，答案附来源；涉及敏感信息会拒绝。</div>
              <div class="empty__chips">
                <button class="chip" data-q="公司有哪些报销制度？">公司有哪些报销制度？</button>
                <button class="chip" data-q="我能申请哪些权限？">我能申请哪些权限？</button>
                <button class="chip" data-q="帮我检查一下环境配置">帮我检查一下环境配置</button>
              </div>
            </div>
          </div>
          <div class="composer">
            <textarea id="input" rows="1" class="sand-input sand-textarea" placeholder="问我公司制度、申请权限、查百科…"></textarea>
            <button id="send" class="sand-kit-button sand-kit-button--accent send-icon-btn" disabled aria-label="发送"><svg class="ic" width="22" height="22"><use href="#i-send"/></svg></button>
            <div class="model-wrap">
              <button id="model-btn" class="model-btn" title="选择模型" aria-label="选择模型"><svg class="ic" width="16" height="16"><use href="#i-menu"/></svg></button>
              <div id="model-menu" class="model-menu hidden"></div>
            </div>
          </div>
          <div class="composer-hint">Enter 发送 · Shift+Enter 换行</div>
        </div>
        <aside id="chat-sidebar" class="chat-sidebar">
          <div class="chat-sidebar__head">
            <span class="chat-sidebar__title">历史会话</span>
            <div class="chat-sidebar__tools">
              <button id="sidebar-new" class="icon-btn" title="新对话" aria-label="新对话"><svg class="ic" width="18" height="18"><use href="#i-plus"/></svg></button>
              <button id="sidebar-collapse" class="sidebar-icon-btn" title="收起" aria-label="收起"><svg class="ic" width="16" height="16"><use href="#i-chev-right"/></svg></button>
            </div>
          </div>
          <div id="sidebar-history" class="chat-sidebar__list"></div>
        </aside>
      </div>
      <button id="sidebar-expand" class="chat-sidebar-expand hidden" title="展开会话列表"><svg class="ic" width="14" height="14"><use href="#i-chev-left"/></svg> 会话</button>
    </section>

    <!-- 今日 -->
    <section id="view-today" class="view">
      <header class="view-head">
        <span>今日概览</span>
        <button id="today-refresh" class="sand-kit-button sand-kit-button--ghost">刷新</button>
      </header>
      <div id="today-body" class="today-scroll">
        <div id="today-date" class="today-date"></div>
        <div class="today-grid">
          <div class="panel today-card">
            <h3>日程 <span class="meta" id="today-schedule-count"></span></h3>
            <div id="today-schedule" class="today-list"></div>
          </div>
          <div class="panel today-card">
            <h3>待办 <span class="meta" id="today-todo-count"></span></h3>
            <div id="today-todos" class="today-list"></div>
          </div>
          <div class="panel today-card today-card--wide">
            <h3>收件箱 <span class="meta" id="today-mail-count"></span></h3>
            <div id="today-mails" class="today-list"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="view-wizard" class="view">
      <header class="view-head">
        <span>安装向导</span>
        <span class="view-head__sub">环境 · 登录 · 个人 Bot · 模型网关 · 守护进程</span>
      </header>
      <div id="wizard-steps" class="wizard-steps"></div>
      <div id="wizard-body" class="panel"></div>
    </section>

    <!-- 权限 -->
    <section id="view-perm" class="view">
      <header class="view-head">
        <span>权限申请</span>
        <button id="perm-refresh" class="sand-kit-button sand-kit-button--ghost">刷新盘点</button>
      </header>
      <div id="perm-scan" class="panel"></div>
      <div id="perm-list" class="list"></div>
    </section>

    <!-- 状态 -->
    <section id="view-status" class="view">
      <header class="view-head">
        <span>环境与登录</span>
        <button id="env-refresh" class="sand-kit-button sand-kit-button--ghost">重新检查</button>
      </header>
      <div id="env" class="panel"></div>
      <div id="login-box" class="panel hidden">
        <h3>飞书登录</h3>
        <p class="hint">在浏览器打开下面的链接完成授权（或扫描二维码）。授权完成后点「我已授权」。</p>
        <div id="login-url" class="login-url"></div>
        <img id="login-qr" alt="登录二维码" class="qr" />
        <div class="row">
          <button id="login-open" class="sand-kit-button">打开链接</button>
          <button id="login-done" class="sand-kit-button sand-kit-button--accent" disabled>我已授权</button>
        </div>
        <div id="login-status" class="hint"></div>
      </div>
    </section>
  </main>

  <!-- 确认弹窗 -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__overlay" data-close></div>
    <div class="modal__card">
      <h3 id="modal-title" class="modal__title"></h3>
      <div id="modal-body" class="modal__body"></div>
      <div class="modal__actions">
        <button id="modal-cancel" class="sand-kit-button">取消</button>
        <button id="modal-ok" class="sand-kit-button sand-kit-button--accent">确认</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <!-- 登录守卫：未登录时全屏盖住主界面，引导飞书扫码登录 + API 配置 -->
  <div id="login-guard" class="login-guard">
    <div class="login-guard__card">
      <div class="login-guard__brand sand-avatar sand-avatar--brand">迈</div>
      <h2>企业 AI 助手</h2>
      <p class="login-guard__sub">飞书扫码登录后，自动完成模型网关配置与身份资料获取</p>
      <div id="guard-step" class="guard-step" data-step="login">
        <!-- idle: 单个主按钮 -->
        <button id="guard-login" class="sand-kit-button sand-kit-button--accent">飞书扫码登录</button>
        <!-- polling: 二维码 + 小字链接 + 等待提示（自动轮询，无需手动点完成） -->
        <div id="guard-polling" class="guard-polling hidden">
          <img id="guard-login-qr" alt="登录二维码" class="qr" />
          <div class="guard-spinner"><span></span>等待扫码授权…</div>
          <a id="guard-login-link" class="login-url" target="_blank">在浏览器中打开 ↗</a>
        </div>
      </div>
      <div id="guard-config" class="guard-step hidden" data-step="config">
        <div class="guard-config-line" id="guard-config-line"></div>
        <button id="guard-portal-get" class="sand-kit-button sand-kit-button--accent">打开公司门户，获取 API Key</button>
        <div class="guard-config-status" id="guard-portal-status"></div>
      </div>
      <div id="guard-status" class="hint"></div>
    </div>
  </div>

  <script src="./vendor/marked.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
