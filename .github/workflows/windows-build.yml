name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install repo root deps (typebox/pi-coding-agent bundle for tauri resources)
        run: npm install

      - name: Install gui deps
        working-directory: gui
        run: npm install

      - name: Prepare embedded pi (bundle)
        working-directory: gui
        shell: pwsh
        run: npm run prepare:pi

      - name: Prepare embedded runtime (node24 + lark-cli)
        working-directory: gui
        shell: pwsh
        run: npm run prepare:runtime

      - name: Build app (Windows)
        working-directory: gui
        shell: pwsh
        run: npx tauri build

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: pi-coworker-windows
          path: |
            gui/src-tauri/target/release/bundle/nsis/**/*.exe
            gui/src-tauri/target/release/bundle/msi/**/*.msi
          if-no-files-found: warn
