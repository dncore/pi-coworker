name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Type check + smoke tests (root)
        run: npm test

      - name: Model-meta drift check (canonical gist)
        run: npm run check:models

      - name: Type check (agent daemon)
        run: npx tsc -p agent/tsconfig.json

      - name: Type check + install (gui backend)
        working-directory: gui
        run: |
          npm install
          npx tsc -p backend/tsconfig.json

      - name: Shell syntax check
        run: |
          bash -n bin/bootstrap.sh
          bash -n scripts/package.sh

      - name: 开源脱敏门禁（内网地址/密钥/真实资源 ID 禁止入库）
        run: |
          # -I：跳过二进制文件。图标/字体等二进制里出现 15 位以上数字是常态
          #（如 icon.icns 的 LZW 解码表就含 18 位数字串），误报会把门禁变成噪声。
          # 最后一档 [0-9]{15,} = 飞书资源 ID（space/token 等雪花号），实际配置放 ~/.coworker/*.json
          HITS=$(git grep -n -I -iE \
            "wonl[a]p|mage[n]e\.cn|to[p]s\.|19[2]\.168\.|fe[d]\.internal|ding[0-9a-fA-F]{10,}|basc[n]_[a-zA-Z0-9]{6,}|cl[i]_[a-zA-Z0-9]{16,}|[0-9]{15,}" \
            -- ':!package-lock.json' ':!gui/src-tauri/Cargo.lock' || true)
          if [ -n "$HITS" ]; then
            echo "❌ 检测到疑似敏感内容："
            echo "$HITS"
            exit 1
          fi
          echo "✅ 脱敏检查通过"
